:root {
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-sans: "Archivo", "Helvetica Neue", Helvetica, sans-serif;
  /* Ojuju — sans numerals, eyebrows and uppercase micro-type */
  --font-eyebrow: "Ojuju", "Archivo", sans-serif;
  --font-numeral: "Ojuju", "Archivo", sans-serif;
  --font-mono: "Geist Mono", "SF Mono", ui-monospace, monospace;
  --font-body: var(--font-sans);
  --font-technical: var(--font-mono);
}

:root{
  /* Paper — the substrate. Warm, printed, never pure white. */
  --paper-000:#FFFDF8;--paper-100:#F7F4EC;--paper-200:#EFEBE0;--paper-300:#E4DFD1;
  /* Ink — text and structure. Cool near-black, never pure black. */
  --ink-900:#101418;--ink-700:#2A3138;--ink-500:#545C64;--ink-400:#7C848C;--ink-300:#9AA1A8;--ink-200:#C7CBCF;
  /* Blueprint — the primary. Cyanotype blue, used for structure and action. */
  --blueprint-700:#173359;--blueprint-600:#1E4478;--blueprint-500:#2E5C9A;--blueprint-400:#5C86BC;--blueprint-200:#B9CCE4;--blueprint-100:#DCE6F2;
  /* Signal — instrument orange. The one accent. Reserved for measurement, effort, "now"; brightens on blueprint rather than inverting. */
  --signal-600:#9E3D0E;--signal-500:#C85416;--signal-300:#E08A56;--signal-100:#F8E4D7;
  /* Plot — viridis, sampled at 6 stops. Sequential or categorical, always in this order. */
  --plot-1:#440154;--plot-2:#414487;--plot-3:#2A788E;--plot-4:#22A884;--plot-5:#7AD151;--plot-6:#FDE725;
  /* Stroke-safe substitutes: viridis' bright end is fill-only on paper. */
  --plot-5-line:#4E9B2E;--plot-6-line:#8F8410;
  /* Status */
  --ok-600:#256349;--ok-500:#2F7A5B;--ok-100:#DDEBE4;
  --warn-600:#95690E;--warn-500:#C08A16;--warn-100:#F6EBD2;
  --err-600:#8E2C20;--err-500:#B33A2B;--err-100:#F5DFDB;

  /* The readout well is darker than every surface in both scopes: a readout is a window, not a label. */
  --well-surface:#0B1015;

  /* Rules — hairlines are the brand's geometry. Notebook blue, never grey. */
  --rule-hair:#CBDDF3;--rule-solid:#9CBBDA;--rule-ink:var(--ink-900);--rule-blue:var(--blueprint-200);

  /* Semantic aliases */
  --surface-page:var(--paper-100);
  --surface-card:var(--paper-000);
  --surface-sunken:var(--paper-200);
  --surface-inverse:var(--ink-900);
  --surface-blueprint:var(--blueprint-700);
  --text-body:var(--ink-700);
  --text-strong:var(--ink-900);
  --text-muted:var(--ink-500);
  --text-faint:var(--ink-400);
  --text-inverse:var(--paper-000);
  --text-link:var(--blueprint-600);
  --text-link-hover:var(--signal-500);
  --text-annotation:var(--ink-400);
  --accent:var(--blueprint-600);
  --accent-hover:var(--blueprint-700);
  --accent-quiet:var(--blueprint-100);
  --measure:var(--signal-500);
  --measure-quiet:var(--signal-100);
  --measure-on:var(--paper-000);
  --border-default:var(--rule-hair);
  --plot-scale:linear-gradient(to right,var(--plot-1),var(--plot-2),var(--plot-3),var(--plot-4),var(--plot-5),var(--plot-6)); /* @kind other */
  --border-strong:var(--ink-900);
  --focus-ring:var(--signal-500);
}

/* Blueprint scope — inverted, for hero panels and dark app chrome. */
.as-blueprint{
  --surface-page:var(--blueprint-700);--surface-card:#1B3B66;--surface-sunken:#13294A;
  --text-body:#C6D6E9;--text-strong:var(--paper-000);--text-muted:#8CA5C4;--text-faint:#6E88A9;
  --border-default:#2F5687;--border-strong:#7FA1C9;--pattern-line:#436EA0;--accent-quiet:#22456F;
  --text-link:#9CC0EB;--rule-hair:#2F5687;
