<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url(../../docs/fonts/barlow-condensed-700.woff2) format('woff2')}
@font-face{font-family:'Space Mono';font-weight:400;src:url(../../docs/fonts/space-mono-400.woff2) format('woff2')}
@font-face{font-family:'Space Mono';font-weight:700;src:url(../../docs/fonts/space-mono-700.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1320px;height:2868px;overflow:hidden;background:#080808;color:#EFEFEF}
.label{position:absolute;left:88px;top:104px;font:700 30px/1 'Space Mono';letter-spacing:4px;color:#8A867F;display:flex;align-items:center;gap:18px}
.label i{width:18px;height:18px;background:#D9F020}
h1{position:absolute;left:88px;right:88px;top:178px;font:700 164px/.9 'Barlow Condensed';text-transform:uppercase;letter-spacing:-2px}
h1 em{font-style:normal;color:#D9F020}
.spec{position:absolute;left:88px;right:88px;top:var(--spec-top);font:400 32px/1.3 'Space Mono';letter-spacing:2px;color:#B0B0B0;text-transform:uppercase;border-top:2px solid #2A2E34;padding-top:26px}
.screen{position:absolute;left:88px;right:88px;top:var(--screen-top,880px);bottom:-2px;border:2px solid #2A2E34;border-bottom:0;overflow:hidden;background:#0b0b0b}
.screen img{display:block;width:100%;transform:translateY(calc(var(--shift) * -1px))}
</style></head>
<body>
<div class="label"><i></i><span id="n"></span></div>
<h1 id="h"></h1>
<div class="spec" id="s"></div>
<div class="screen"><img id="img"></div>
<script>
// ponytail: one page, config by ?n=; shift is in rendered px (status bar crop or focus)
const SRC = '../../website images/';
const shots = {
  1: {img:'IMG_1935.PNG', shift:140, h:'See what the <em>wind</em> sees.', s:'TUCKED 5569 CM² · TALL 6297 CM²'},
  2: {img:'sim/capture.png', shift:160, h:'Your wind tunnel is a <em>roller door.</em>', s:'ONE PHOTO · PLAIN WALL · 5–6 M BACK'},
  3: {img:'IMG_1936.PNG', shift:246, h:'4–12 min per 100&nbsp;km. <em>Probably.</em>', s:'ESTIMATE · A RANGE, NOT A PROMISE'},
  4: {img:'IMG_1931.PNG', shift:140, h:'Your handlebars are <em>the ruler.</em>', s:'740 MM BAR → PIXELS PER CM'},
  5: {img:'sim/set-the-scene.png', shift:160, h:'Good light in, <em>good numbers out.</em>', s:'TOLERANCE ±3% · WIND TUNNEL: NONE'},
  6: {img:'compare-pauls-bike.webp', shift:246, h:'Too small to trust? <em>We say so.</em>', s:'1.3% APART · INSIDE THE NOISE · 0–4 MIN'},
};
const n = +new URLSearchParams(location.search).get('n') || 1, c = shots[n];
document.getElementById('n').textContent = 'GET TUCKED · 0' + n + ' / 06';
document.getElementById('h').innerHTML = c.h;
document.getElementById('s').textContent = c.s;
const img = document.getElementById('img');
img.style.setProperty('--shift', c.shift);
img.src = SRC + c.img;
// spec sits under however many lines the headline wrapped to
document.fonts.ready.then(() => {
  const h = document.getElementById('h');
  const sp = document.getElementById('s');
  sp.style.setProperty('--spec-top', (h.offsetTop + h.offsetHeight + 40) + 'px');
  document.querySelector('.screen').style.setProperty('--screen-top', (sp.offsetTop + sp.offsetHeight + 64) + 'px');
});
</script>
</body></html>
