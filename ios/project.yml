name: GetTucked
options:
  bundleIdPrefix: com.gettucked
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  GetTucked:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GetTucked
        excludes:
          - "Resources/Assets.xcassets"
    resources:
      - path: GetTucked/Resources/Assets.xcassets
    info:
      path: GetTucked/Resources/Info.plist
      properties:
        CFBundleDisplayName: Get Tucked
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Get Tucked needs camera access to photograph your riding position."
        NSPhotoLibraryUsageDescription: "Get Tucked saves source photos to your library."
        NSPhotoLibraryAddUsageDescription: "Get Tucked saves source photos to your library."
        NSMotionUsageDescription: "Get Tucked uses motion data to keep the camera level during capture."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gettucked.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_FILE: GetTucked/Resources/Info.plist
